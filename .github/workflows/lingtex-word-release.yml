name: LingTeX-Word pre-release

# Packages the committed LingTeX-Word.dotm with its installers and publishes a
# GitHub pre-release. CI cannot BUILD the template -- the VBA project is a
# binary only Word writes, and no runner has Word -- so the template is built
# in Word by hand (LingTeX-Word/RELEASING.md), injected and verified by the
# scripts, and committed; this workflow verifies it again and ships it.
#
# Four jobs: `package` (Linux) checks the template, renders the guide and
# builds the Windows installer and zip; `dmg` (macOS, the only runner with
# hdiutil) builds the Mac disk image; `installer-test` runs the Windows
# installer for real on a Windows runner (lingtex-word-installer-test.yml);
# `publish` (Linux) makes the release once all three have passed.
#
# Push a tag, e.g. word-v0.1.0-beta.1, and it runs from the tagged commit (so
# it works from any branch); or, once this file is on the default branch, run
# it from the Actions tab with a label. Public repository, standard runners
# (ubuntu-latest, macos-latest, windows-latest): free.

on:
  push:
    tags:
      - 'word-v*'
  workflow_dispatch:
    inputs:
      label:
        description: 'Version label for the tag, e.g. beta.1'
        required: true
        default: 'beta.1'

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The whole history and its tags: check-dotm.sh compares
          # SETUP_VERSION with the previous release's.
          fetch-depth: 0

      - name: The template is committed and matches src/
        run: |
          [ -f LingTeX-Word/LingTeX-Word.dotm ] || { echo "::error::LingTeX-Word/LingTeX-Word.dotm is not committed; see LingTeX-Word/RELEASING.md"; exit 1; }
          sh LingTeX-Word/tools/check-dotm.sh

      - name: NSIS
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq nsis

      - name: The user guide (PDF from GUIDE.md, icons inline)
        # Pure Python; the runner's python3 plus three pip packages, seconds.
        run: |
          python3 -m pip install --quiet --disable-pip-version-check markdown reportlab pillow

      - name: The tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then tag="${{ github.ref_name }}"; else tag="word-v0.1.0-${{ inputs.label }}"; fi
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "VERSION=${tag#word-v}" >> "$GITHUB_ENV"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "$tag"

      - name: Render the guide
        run: |
          mkdir -p out
          python3 LingTeX-Word/tools/make-guide.py --version "$TAG" --out "out/LingTeX-Word-Guide-$TAG.pdf"

      - name: Windows installer (.exe)
        # The same two actions as install.bat, wrapped for people who would
        # rather not see a console: copy the template into STARTUP, register an
        # uninstaller. Unsigned: SmartScreen will say "unknown publisher".
        run: |
          mkdir -p out
          makensis -V2 -DVERSION="$VERSION" \
            -DDOTM="$PWD/LingTeX-Word/LingTeX-Word.dotm" \
            -DOUT="$PWD/out/LingTeX-Word-Setup.exe" \
            LingTeX-Word/install/installer.nsi
          ls -la out

      - name: Windows zip
        run: |
          tag="$TAG"
          mv out/LingTeX-Word-Setup.exe "out/LingTeX-Word-Setup-$tag.exe"
          mkdir -p out/win
          cp LingTeX-Word/LingTeX-Word.dotm LingTeX-Word/install/INSTALL.md out/win/
          cp LingTeX-Word/install/install.bat LingTeX-Word/install/install.ps1 out/win/
          cp "out/LingTeX-Word-Guide-$tag.pdf" out/win/LingTeX-Word-Guide.pdf
          ( cd out/win && zip -q -X -r "../LingTeX-Word-$tag-windows.zip" . )
          cp LingTeX-Word/LingTeX-Word.dotm out/
          ls -la out

      - name: Hand the files to the next jobs
        uses: actions/upload-artifact@v4
        with:
          name: release-files
          path: |
            out/LingTeX-Word-Setup-*.exe
            out/LingTeX-Word-*-windows.zip
            out/LingTeX-Word-Guide-*.pdf
            out/LingTeX-Word.dotm
          if-no-files-found: error
          retention-days: 1

  dmg:
    # The Mac download: a disk image holding the template, the two Script
    # Editor documents that install and remove it (compiled from the
    # .applescript sources), and the guide. A script document rather than an
    # installer app, because Gatekeeper blocks an unsigned downloaded program.
    needs: package
    runs-on: macos-latest
    env:
      TAG: ${{ needs.package.outputs.tag }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: The files from package
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: Mac disk image (.dmg)
        run: |
          stage="$RUNNER_TEMP/LingTeX-Word"
          dmg="out/LingTeX-Word-$TAG-macos.dmg"
          mkdir -p "$stage"
          cp out/LingTeX-Word.dotm "$stage/"
          cp "out/LingTeX-Word-Guide-$TAG.pdf" "$stage/LingTeX-Word-Guide.pdf"
          # The scripts ship COMPILED, as .scpt documents. A plain-text script is
          # recompiled by Script Editor when Run is pressed, and on a read-only
          # disk image that edit makes it ask to Unlock or Duplicate (Seth's test,
          # 2026-09-14). A .scpt is a single-file document, not an app: it opens
          # in Script Editor showing its source and comments. Never osacompile -x
          # (run-only), which would strip the source the user is meant to read.
          for k in Install Uninstall; do
            src="LingTeX-Word/install/$k LingTeX-Word.applescript"
            dst="$stage/$k LingTeX-Word.scpt"
            osacompile -o "$dst" "$src"
            [ -f "$dst" ] || { echo "::error::$dst is not a single-file document"; exit 1; }
            osadecompile "$dst" | grep -q "WHAT IT DOES" || { echo "::error::$dst does not carry its source"; exit 1; }
          done
          # HFS+ so older macOS mounts it too. hdiutil on hosted runners now and
          # then fails with "Resource busy"; a retry clears it.
          for attempt in 1 2 3; do
            hdiutil create -volname "LingTeX-Word" -srcfolder "$stage" -fs HFS+ -format UDZO -ov "$dmg" && break
            echo "hdiutil create failed (attempt $attempt); retrying"; sleep 10
          done
          [ -f "$dmg" ] || { echo "::error::no disk image was made"; exit 1; }
          hdiutil verify "$dmg"
          ls -la out

      - name: Hand the disk image to publish
        uses: actions/upload-artifact@v4
        with:
          name: dmg
          path: out/LingTeX-Word-*-macos.dmg
          if-no-files-found: error
          retention-days: 1

  installer-test:
    # The .exe built the same way, installed, upgraded, refused while Word runs
    # or the old file is held open, and uninstalled, on a Windows runner.
    uses: ./.github/workflows/lingtex-word-installer-test.yml

  publish:
    needs: [package, dmg, installer-test]
    runs-on: ubuntu-latest
    env:
      TAG: ${{ needs.package.outputs.tag }}
    steps:
      - name: The files from package
        uses: actions/download-artifact@v4
        with:
          name: release-files
          path: out

      - name: The disk image from dmg
        uses: actions/download-artifact@v4
        with:
          name: dmg
          path: out

      - name: List
        run: ls -la out

      - name: Publish pre-release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: 'LingTeX-Word ${{ env.TAG }} (pre-release)'
          prerelease: true
          fail_on_unmatched_files: true
          files: |
            out/LingTeX-Word-Setup-${{ env.TAG }}.exe
            out/LingTeX-Word-${{ env.TAG }}-windows.zip
            out/LingTeX-Word-${{ env.TAG }}-macos.dmg
            out/LingTeX-Word-Guide-${{ env.TAG }}.pdf
            out/LingTeX-Word.dotm
          body: |
            **LingTeX-Word** is a Word add-in for interlinear glossed text: paste an
            example from FLEx (or type it), and it becomes a borderless table that
            wraps to the page and re-wraps when the page changes; columns split and
            merge; glossing is checked against the Leipzig rules; examples are
            numbered with Word's own numbering and can be indented.

            This is a **pre-release**: tested by hand on Mac and Windows, one Word
            each. Please report what breaks.

            ## Install

            Close Word first, then:

            - **Windows:** run `LingTeX-Word-Setup-…exe`. It is unsigned, so
              SmartScreen says "unknown publisher": More info → Run anyway. It
              copies `LingTeX-Word.dotm` into `%APPDATA%\Microsoft\Word\STARTUP`
              and registers an uninstaller under Settings → Apps. (The
              `-windows.zip` holds the same template with `install.bat`, for
              anyone who prefers to see what the installer does.)
            - **Mac:** open `-macos.dmg` and double-click **Install LingTeX-Word**.
              It opens in Script Editor with what it does written at the top; click
              the **Run** button (the triangle) and follow the messages. If macOS
              asks whether Script Editor may access data from other apps, click
              **Allow**: that is the copy into Word's folder. It copies the template
              into Word's Startup folder, replacing an earlier version, and clears
              the download quarantine. When Word asks whether to enable macros in
              `LingTeX-Word.dotm`, choose **Enable Macros**.
            - **The user guide** is `LingTeX-Word-Guide-…pdf`, and is inside the
              Windows zip and the Mac disk image.

            Then start Word. A message says LingTeX-Word is installed and lists its
            keyboard shortcuts (Ctrl+Alt+Shift + a letter on Windows,
            Cmd+Option+Shift + a letter on Mac; a key Word already uses is skipped
            for an alternate letter, and **Shortcuts** on the tab lists what
            landed). The **Interlinear** tab is on the ribbon of every document.

            **Upgrading** is the same: run the new installer and it replaces the
            old file. If your keyboard shortcuts stop working after an upgrade,
            click **Install Shortcuts** on the Interlinear tab once. To remove the
            add-in: Settings → Apps on Windows, or **Uninstall LingTeX-Word** from
            the disk image on the Mac.
